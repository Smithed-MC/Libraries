name: Build Nightly Libraries

on:
  push:
    branches:
      - main
    paths:
      - src/smithed_libraries/packs/**

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/smithed_libraries/packs/**

  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    #----------------------------------------------
    #       check-out repo and set-up python
    #----------------------------------------------
    steps:
      - uses: actions/checkout@v7.0.1

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      #----------------------------------------------
      #             install dependencies
      #----------------------------------------------
      - name: Install workflow dependencies
        run: uv sync --locked --no-default-groups --group github-workflows

      #----------------------------------------------
      #          Build libraries via beet
      #----------------------------------------------
      - name: Build via beet
        run: uv run --locked --no-default-groups --group github-workflows beet -s "data_pack.zipped = true" -s "resource_pack.zipped = true"

      #----------------------------------------------
      #           Upload artifacts to GH
      #----------------------------------------------
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/
