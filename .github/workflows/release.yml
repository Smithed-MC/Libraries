name: Release Packages

on:
  push:
    branches:
      - main
    paths:
      - src/smithed_libraries/packs/**
      - pyproject.toml

  workflow_dispatch:

concurrency:
  group: smithed-release
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      #----------------------------------------------
      #            Setup Build Environment
      #----------------------------------------------

      - name: Checkout 'main'
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout 'releases'
        uses: actions/checkout@v7.0.1
        with:
          path: "releases"
          ref: "releases"
          fetch-depth: 0

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.11" # pinned to avoid CI bugs
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install workflow dependencies
        run: |
          uv sync --locked --no-default-groups --group github-workflows

          # Put the project virtual environment on PATH so later
          # shell: python steps can import the workflow dependencies.
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - id: beet-config
        name: Read Minecraft version
        shell: python
        run: |
          import os
          import yaml

          with open("beet.yaml") as config_file:
              mc_version = yaml.safe_load(config_file)["minecraft"]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"mc_version={mc_version}", file=output)

      #----------------------------------------------
      #       Build packs and copy to branch
      #----------------------------------------------

      - id: beet-build
        name: Build via Beet
        run: |
          mkdir -p dist
          cp "releases/${{ steps.beet-config.outputs.mc_version }}/manifest.json" dist/manifest.json
          uv run --locked --no-default-groups --group github-workflows python .github/workflows/build-changes.py
          echo $(ls dist)

      #----------------------------------------------
      #        Commit built packs to branch
      #----------------------------------------------
      #  We use `&&` to ensure git steps are atomic
      #----------------------------------------------

      - id: release-version
        name: Determine package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(uv run --locked --no-default-groups --group github-workflows semantic-release version --print)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - id: push-to-branch
        name: Copy and push release files to branch
        if: steps.beet-build.outputs.build_changes == 'true'
        run: |
          set -e

          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format=%B)

          mkdir -p "releases/${{ steps.beet-config.outputs.mc_version }}"
          cp -rf "dist/"* "releases/${{ steps.beet-config.outputs.mc_version }}"
          cd releases

          VERSION="${{ steps.release-version.outputs.version }}"

          git add .
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git commit -m "🚀 $SHORT_HASH (v$VERSION): $COMMIT_MSG"
          git push --force origin releases

          echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      #----------------------------------------------
      #                 Push to PYPI
      #----------------------------------------------

      - id: pypi-release
        name: Release for PYPI
        if: github.repository == 'Smithed-MC/Libraries'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <action@github.com>"
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          uv run --locked --no-default-groups --group github-workflows semantic-release -v version

      - name: Publish to PYPI
        if: steps.pypi-release.outputs.released == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish "dist/*.whl" "dist/*.tar.gz"

      - name: Publish to GitHub Releases
        if: steps.pypi-release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked --no-default-groups --group github-workflows semantic-release -v publish

      #----------------------------------------------
      #        Push packs to Smithed via API
      #----------------------------------------------
      #    We load in a ton of data into env vars
      #----------------------------------------------

      - name: Push built packs to Smithed
        if: steps.beet-build.outputs.build_changes == 'true'
        run: uv run --locked --no-default-groups --group github-workflows python .github/workflows/push-to-smithed.py
        env:
          COMMIT_HASH: ${{ steps.push-to-branch.outputs.commit_hash}}
          BUILT_PACKS: ${{ steps.beet-build.outputs.built_packs }}
          SMITHED_UID: ${{ secrets.SMITHED_UID }}
          SMITHED_TOKEN: ${{ secrets.SMITHED_TOKEN }}
