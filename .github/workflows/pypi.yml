name: Release PYPI

on:
  - workflow_dispatch

concurrency:
  group: smithed-release
  cancel-in-progress: false

env:
  COMMIT_MSG: ${{ github.event.head_commit.message }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      #----------------------------------------------
      #            Setup Build Environment
      #----------------------------------------------

      - name: Checkout 'main'
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      #----------------------------------------------
      #  -----  install & configure poetry  -----
      #----------------------------------------------
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.11"
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install workflow dependencies
        run: uv sync --locked --no-default-groups --group github-workflows

      #----------------------------------------------
      #                 Push to PYPI
      #----------------------------------------------

      - name: Release for PYPI
        id: pypi_release
        if: |
          github.repository == 'Smithed-MC/Libraries'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <action@github.com>"
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          uv run --locked --no-default-groups --group github-workflows semantic-release -v version

      - name: Publish to PYPI
        if: steps.pypi_release.outputs.released == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish "dist/*.whl" "dist/*.tar.gz"

      - name: Publish to GitHub Releases
        if: steps.pypi_release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked --no-default-groups --group github-workflows semantic-release -v publish
